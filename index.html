<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the machine — a field study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EFEAE0; --ink:#2B2B33; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper)}
  body{font-family:'IBM Plex Mono',monospace;color:var(--ink)}
  canvas{display:block;position:relative;width:100%;height:100vh;}
  #title{position:absolute;top:18px;left:22px;font-family:'Caveat',cursive;
    font-size:22px;font-weight:600;opacity:.55;pointer-events:none;user-select:none}
  #captionBox{position:absolute;left:26px;bottom:24px;max-width:min(720px,74vw);
    pointer-events:none;user-select:none}
  #cap{font-family:'Caveat',cursive;font-weight:600;
    font-size:clamp(26px,3.4vw,40px);line-height:1.05;transition:opacity .45s ease}
  #sub{font-size:clamp(11px,1.15vw,13.5px);line-height:1.5;opacity:.62;
    margin-top:8px;transition:opacity .45s ease}
  .capfade{opacity:0 !important}
  #hud{position:absolute;right:22px;bottom:24px;text-align:right;
    font-size:11.5px;letter-spacing:.06em;opacity:.55;user-select:none;pointer-events:none}
  #pips{margin-bottom:6px;font-variant-numeric:tabular-nums}
  kbd{border:1px solid var(--ink);border-radius:3px;padding:0 4px;font-family:inherit;font-size:10.5px}
  @media (prefers-reduced-motion: reduce){ #cap,#sub{transition:none} }
</style>
</head>
<body>
<div style="position:relative; width:100%; height:100vh; overflow:hidden;">
  <canvas id="cv"></canvas>
  <div id="title">the machine — a field study</div>
  <div id="captionBox" style="display:none;"><div id="cap"></div><div id="sub"></div></div>
  <div id="hud">
    <div style="margin-bottom: 8px; pointer-events: auto;">
      <label for="speedDial">Speed:</label> 
      <input type="range" id="speedDial" min="0.0" max="50.0" step="1.0" value="1.0" style="vertical-align: middle;">
      <button id="resetBtn" style="margin-left: 8px; padding: 2px 6px; cursor: pointer; border: 1px solid var(--ink); background: var(--paper); border-radius: 3px; font-family: inherit;">Reset Factory</button>
    </div>
    <div id="pips">1 / 12</div>
    <div><kbd>→</kbd> next &nbsp; <kbd>←</kbd> back &nbsp; or click</div>
  </div>
</div>
<div id="statsPanel" style="max-width: 1600px; margin: 24px auto; font-size:11px; font-family:'IBM Plex Mono',monospace; line-height:1.2; border: 2px solid #2B2B33; border-radius: 6px; position:relative;"></div>
<script type="module" src="main.js?v=3"></script>
</body>
</html>
